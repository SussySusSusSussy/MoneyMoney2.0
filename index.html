<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Sistema Financiero</title>
<link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

<h1>Panel Financiero</h1>
<button onclick="toggleDark()">🌙 / ☀️</button>
  
<!-- CONFIG -->
<h2>Configuración</h2>

<select id="moneda">
  <option value="CRC">Colones (₡)</option>
  <option value="USD">Dólares ($)</option>
</select>

<p>Tipo de cambio: <span id="tc">...</span></p>

<hr>

<!-- SUSCRIPCIONES -->
<h2>Suscripciones</h2>

<input id="subNombre" placeholder="Nombre">
<input id="subPrecio" type="number" placeholder="USD">
<input id="subDia" type="number" placeholder="Día">
<button onclick="agregarSub()">Agregar</button>

<table border="1">
<thead>
<tr>
<th>Nombre</th>
<th>Precio</th>
<th>Día</th>
<th>Estado</th>
<th>X</th>
</tr>
</thead>
<tbody id="tablaSubs"></tbody>
</table>

<hr>

<!-- INGRESOS -->
<h2>Ingresos</h2>

<input type="date" id="ingFecha">
<button onclick="ponerFechaHoy()">Hoy</button>

<input type="number" id="ingMonto">
<button onclick="agregarIngreso()">Agregar</button>

<button onclick="resetMes()">Reset Mes</button>

<table border="1">
<thead>
<tr>
<th>Fecha</th>
<th>Monto</th>
<th>X</th>
</tr>
</thead>
<tbody id="tablaIngresos"></tbody>
</table>
<p id="total7dias"></p>
<hr>

<!-- RESUMEN -->
<h2>Resumen</h2>

<p>Total: <span id="totalMes"></span></p>
<p id="estadoDinero"></p>
<p>Fondo 5%: <span id="fondo"></span></p>
<p>Disponible: <span id="disponible"></span></p>

<hr>

<h2>Gráfica</h2>
<canvas id="grafica"></canvas>

<!-- DEV PANEL -->
<div id="devPanel" style="display:none; border:2px solid red; padding:10px;">
  <h3>DEV MODE</h3>
  <p>TC: <span id="devTC"></span></p>
  <p>Total: <span id="devTotal"></span></p>
  <p>Disponible: <span id="devDisponible"></span></p>
  <button onclick="forzarAPI()">Forzar API</button>
  <button onclick="resetTodo()">RESET TODO</button>
</div>

<script src="script.js"></script>

</body>
</html>
